# DockTail Cloud — local end-to-end test stack (NO tailnet required).
#
# The cloud module now self-discovers containers (cloud/collector.go:discoverLoop),
# so it reports services independently of Tailscale. This stack therefore runs
# docktail with NO tailscale sidecar: the tailscale serve reconcile will log
# errors (no daemon) but the cloud still receives the service snapshot.
#
# Builds docktail from source (`build: .`) so the image includes the cloud module,
# mounts the real OrbStack docker socket (/var/run/docker.sock is a dead symlink
# on this machine), and points the agent at the local agent-plane on the host.
#
# Prereqs in ./.env (gitignored):  DOCKTAIL_CLOUD_KEY=dtc_...   (already set)
#
# Bring up:
#   docker compose -f docker-compose.cloud-test.yaml up -d --build
#   docker compose -f docker-compose.cloud-test.yaml logs -f docktail
#   docker compose -f docker-compose.cloud-test.yaml down
name: docktail-cloud-test

services:
  docktail:
    build: .
    container_name: docktail-ct
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - RECONCILE_INTERVAL=30s
      - DOCKTAIL_CLOUD_KEY=${DOCKTAIL_CLOUD_KEY:?set DOCKTAIL_CLOUD_KEY in ../docktail/.env}
      # Inside the container the agent-plane is on the HOST, not localhost.
      - DOCKTAIL_CLOUD_URL=ws://host.docker.internal:8080/v1/agent
      - DOCKTAIL_LOG_LEVEL=debug
      # Self-discovery cadence (cloud snapshot interval); also the local-check cadence.
      - DOCKTAIL_CHECK_INTERVAL=15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # /var/run/docker.sock is a dead symlink on this host — mount the real OrbStack socket.
      - /Users/mvr/.orbstack/run/docker.sock:/var/run/docker.sock:ro

  web1:
    image: nginx:alpine
    container_name: ct-web1
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=ct-web1"
      - "docktail.service.port=80"
      - "docktail.service.protocol=http"

  web2:
    image: nginx:alpine
    container_name: ct-web2
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=ct-web2"
      - "docktail.service.port=80"
      - "docktail.service.service-protocol=https"

  api:
    image: nginx:alpine
    container_name: ct-api
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=ct-api"
      - "docktail.service.port=80"
      - "docktail.service.protocol=tcp"
