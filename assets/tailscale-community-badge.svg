<svg xmlns="http://www.w3.org/2000/svg" width="298" height="54" viewBox="0 0 298 54" role="img" aria-label="Featured on Tailscale Community Projects">
  <title>Featured on Tailscale Community</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#1d1d1d"/>
    </linearGradient>
  </defs>

  <!-- Pill -->
  <rect x="0.75" y="0.75" width="296.5" height="52.5" rx="11.25"
        fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Tailscale mark (3x3 dot grid): solid = middle row + bottom-center, dim = rest -->
  <g transform="translate(15,14) scale(1.0833)" fill="#ffffff">
    <!-- top row (dim) -->
    <circle cx="3"  cy="3"  r="3" opacity="0.32"/>
    <circle cx="12" cy="3"  r="3" opacity="0.32"/>
    <circle cx="21" cy="3"  r="3" opacity="0.32"/>
    <!-- middle row (solid) -->
    <circle cx="3"  cy="12" r="3"/>
    <circle cx="12" cy="12" r="3"/>
    <circle cx="21" cy="12" r="3"/>
    <!-- bottom row (center solid, sides dim) -->
    <circle cx="3"  cy="21" r="3" opacity="0.32"/>
    <circle cx="12" cy="21" r="3"/>
    <circle cx="21" cy="21" r="3" opacity="0.32"/>
  </g>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="54" y="22" fill="#ffffff" fill-opacity="0.66" font-size="9"
          font-weight="600" letter-spacing="1.4">FEATURED ON</text>
    <text x="53.5" y="40" fill="#ffffff" font-size="16" font-weight="700"
          letter-spacing="0.2">Tailscale Community Projects</text>
  </g>
</svg>
